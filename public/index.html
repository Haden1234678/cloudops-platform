<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudOps Platform</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; background: #0f1720; color: #e6edf3; }
    h1 { font-size: 1.3rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 12px 16px; margin: 8px 0; background: #1b2530; border-radius: 8px; }
    .up { color: #3fb950; }
    .down { color: #f85149; }
  </style>
</head>
<body>
  <h1>CloudOps Platform — Service Status</h1>
  <ul id="services"></ul>
  <script>
    fetch('/api/services')
      .then((response) => response.json())
      .then((services) => {
        const list = document.getElementById('services');
        services.forEach((service) => {
          const item = document.createElement('li');
          const name = document.createElement('span');
          name.textContent = service.name;
          const status = document.createElement('span');
          status.textContent = service.status;
          status.className = service.status === 'up' ? 'up' : 'down';
          item.appendChild(name);
          item.appendChild(status);
          list.appendChild(item);
        });
      });
  </script>
</body>
</html>
